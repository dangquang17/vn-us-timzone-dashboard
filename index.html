<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A real-time dashboard for Vietnam and United States time zones." />
  <meta name="theme-color" content="#fffaf2" />
  <style>
    html:not([data-theme-ready="true"]) body {
      visibility: hidden;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      var storageKey = "vn-us-clock-theme";
      var storedMode = localStorage.getItem(storageKey);
      var mode =
        storedMode === "light" || storedMode === "dark" || storedMode === "system"
          ? storedMode
          : "system";
      var resolvedTheme =
        mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : mode === "system"
            ? "light"
            : mode;
      var root = document.documentElement;

      root.dataset.theme = resolvedTheme;
      root.dataset.themeReady = "true";
      root.style.colorScheme = resolvedTheme;

      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) {
        var themeColor = getComputedStyle(root).getPropertyValue("--theme-browser").trim();
        if (themeColor) {
          themeMeta.setAttribute("content", themeColor);
        }
      }
    })();
  </script>
  <title>Vietnam & US Timezone Dashboard</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
